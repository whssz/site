# Deploy do site da Confeitaria Agridoce na Vercel.
# Dispara em push nas branches de sessão (arena/*) e manualmente.
# O runner tem rede livre: usa a Vercel CLI com o token guardado em
# Settings → Secrets → VERCEL_TOKEN (token de curta duração, revogável).
name: deploy-vercel

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "public/**"
      - "scripts/**"
      - "package.json"
      - ".vercelignore"
      - ".github/workflows/deploy-vercel.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vercel CLI
        run: npm i -g vercel@latest

      - name: Link do projeto (direto, sem prompt)
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'EOF'
          {"projectId":"prj_vZbH7GcWFzW9DSR1Zpr7eeUTxfSE","orgId":"team_z6tahC0dowvMZFiASHvvIgBP"}
          EOF

      - name: Deploy produção
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          { vercel whoami --token "$VERCEL_TOKEN" ; vercel deploy --prod --yes --token "$VERCEL_TOKEN" ; } 2>&1 | tee deploy.log
      - name: Publicar log de falha (env var na Vercel, lida pelo conector)
        if: failure()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          LOG=$(tail -c 3000 deploy.log 2>/dev/null | base64 -w0)
          [ -z "$LOG" ] && LOG="c2VtIGxvZw=="
          curl -sS -X DELETE "https://api.vercel.com/v9/projects/prj_vZbH7GcWFzW9DSR1Zpr7eeUTxfSE/env/DEPLOY_LOG?teamId=team_z6tahC0dowvMZFiASHvvIgBP" \
            -H "Authorization: Bearer $VERCEL_TOKEN" || true
          curl -sS -X POST "https://api.vercel.com/v9/projects/prj_vZbH7GcWFzW9DSR1Zpr7eeUTxfSE/env?teamId=team_z6tahC0dowvMZFiASHvvIgBP" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"key\":\"DEPLOY_LOG\",\"value\":\"$LOG\",\"type\":\"plain\",\"target\":[\"production\"]}" || true

      - name: Garantir link público (sem Deployment Protection)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS -X PATCH \
            "https://api.vercel.com/v9/projects/prj_vZbH7GcWFzW9DSR1Zpr7eeUTxfSE?teamId=team_z6tahC0dowvMZFiASHvvIgBP" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ssoProtection":null}' || echo "aviso: não foi possível ajustar a proteção"

      - name: URL publicada
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel ls --token "$VERCEL_TOKEN" 2>/dev/null | head -8 || true
