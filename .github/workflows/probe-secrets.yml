name: Diagnóstico de segredos Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sem-ambiente:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar segredos de repositório
        env:
          T1: ${{ secrets.VERCEL_TOKEN }}
          T2: ${{ secrets.VERCEL_API_TOKEN }}
          T3: ${{ secrets.VC_TOKEN }}
        run: |
          echo "repo::VERCEL_TOKEN=$([ -n "${T1:-}" ] && echo presente || echo ausente)"
          echo "repo::VERCEL_API_TOKEN=$([ -n "${T2:-}" ] && echo presente || echo ausente)"
          echo "repo::VC_TOKEN=$([ -n "${T3:-}" ] && echo ausente)"
          echo "::notice::repo::VERCEL_TOKEN=$([ -n "${T1:-}" ] && echo presente || echo ausente)"

  com-ambiente:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: production
    steps:
      - name: Verificar segredos do ambiente
        env:
          T1: ${{ secrets.VERCEL_TOKEN }}
          T2: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          echo "env::VERCEL_TOKEN=$([ -n "${T1:-}" ] && echo presente || echo ausente)"
          echo "env::VERCEL_API_TOKEN=$([ -n "${T2:-}" ] && echo presente || echo ausente)"
          echo "::notice::env::VERCEL_TOKEN=$([ -n "${T1:-}" ] && echo presente || echo ausente)"
