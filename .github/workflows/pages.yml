name: Publicar no GitHub Pages

on:
  push:
    branches: ["arena/df6311cd-site"]
    paths:
      - "index.html"
      - "assets/**"
      - "build.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez.
concurrency:
  group: github-pages-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build e publicação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build estático
        run: |
          bash build.sh
          test -f dist/index.html

      # O ambiente github-pages só aceita a branch main por política de
      # branches. Tenta acrescentar a branch do site para permitir a publicação.
      - name: Permitir a branch do site no ambiente github-pages
        if: ${{ github.ref_name != 'main' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set +e
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/environments/github-pages/deployment-branch-policies" \
            -f "name=${BRANCH}" -f type=branch
          echo "::warning::branch-policy exit=$?"

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
