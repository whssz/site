name: Probe de permissões do GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnóstico
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          say() { echo "::error title=$1::$2"; }

          for ENV in production github-pages; do
            CODE=$(curl -sS -o /tmp/pol.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/${ENV}/deployment-branch-policies" \
              -d '{"name":"arena/df6311cd-site","type":"branch"}')
            COMPACT=$(jq -c . /tmp/pol.json 2>/dev/null | head -c 250 || head -c 250 /tmp/pol.json)
            say "POST-policy-${ENV}" "status=${CODE} ${COMPACT}"
          done

          CODE=$(curl -sS -o /tmp/envs.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments")
          say "GET-environments" "status=${CODE} $(jq -c '[.environments[]|{name, deployment_branch_policy}]' /tmp/envs.json 2>/dev/null | head -c 400)"

          CODE=$(curl -sS -o /tmp/pols.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")
          say "GET-policies-production" "status=${CODE} $(head -c 300 /tmp/pols.json)"
