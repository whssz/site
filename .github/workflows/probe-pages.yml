name: Probe de permissões do GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnóstico
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          say() { echo "::error title=$1::$2"; }

          for BODY in \
            '{"source":{"branch":"arena/df6311cd-site","path":"/"},"build_type":"workflow"}' \
            '{"build_type":"workflow"}' \
            '{"source":{"branch":"arena/df6311cd-site","path":"/"}}' ; do
            CODE=$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d "$BODY")
            COMPACT=$(jq -c . /tmp/put.json 2>/dev/null | head -c 300 || head -c 300 /tmp/put.json)
            say "PUT" "req=${BODY} status=${CODE} resp=${COMPACT}"
          done

          CODE=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          COMPACT=$(jq -c '{build_type, source, public}' /tmp/pages.json 2>/dev/null | head -c 300)
          say "GET-pages" "status=${CODE} ${COMPACT}"
