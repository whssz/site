name: Probe de permissões do GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnóstico
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          say() { echo "::error title=$1::$2"; }

          CODE=$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"arena/df6311cd-site","path":"/"},"build_type":"workflow"}')
          say "PUT-pages" "status=${CODE} body=$(head -c 250 /tmp/put.json)"

          CODE=$(curl -sS -o /tmp/pol.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/github-pages/deployment-branch-policies" \
            -d '{"name":"arena/df6311cd-site","type":"branch"}')
          say "POST-branch-policy" "status=${CODE} body=$(head -c 250 /tmp/pol.json)"

          CODE=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          say "GET-pages" "status=${CODE} body=$(head -c 250 /tmp/pages.json)"
