name: Probe links
on:
  push:
    branches: ["arena/153289a3-site"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Testar candidatos
        run: |
          probe() {
            local label="$1" url="$2"
            local code size ct
            code=$(curl -sSL --connect-timeout 15 --max-time 90 -o /tmp/out.bin \
              -D /tmp/h.txt -w '%{http_code}' "$url" || true)
            size=$(wc -c < /tmp/out.bin 2>/dev/null || echo 0)
            ct=$(grep -i '^content-type' /tmp/h.txt | tail -1 | tr -d '\r')
            echo "::warning title=probe::$label | HTTP=$code | bytes=$size | $ct | $url"
          }
          probe "githack"      "https://raw.githack.com/whssz/site/site-v1/public/index.html"
          probe "githack-cdn"  "https://rawcdn.githack.com/whssz/site/site-v1/public/index.html"
          probe "githack-master" "https://raw.githack.com/whssz/site/main/public/index.html"
          probe "htmlpreview"  "https://htmlpreview.github.io/?https://raw.githubusercontent.com/whssz/site/site-v1/public/index.html"
          probe "allorigins"   "https://api.allorigins.win/raw?url=https%3A%2F%2Fraw.githubusercontent.com%2Fwhssz%2Fsite%2Fsite-v1%2Fpublic%2Findex.html"
          probe "pages-title"  "https://whssz.github.io/site/"
          echo "--- titulo da pagina do Pages:"
          curl -sSL --max-time 60 "https://whssz.github.io/site/" | grep -o '<title>[^<]*</title>' | head -2
