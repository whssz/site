name: Probe links
on:
  push:
    branches: ["arena/153289a3-site"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Testar candidatos
        run: |
          probe() {
            local label="$1" url="$2"
            local code size ct
            code=$(curl -sSL --connect-timeout 15 --max-time 90 -o /tmp/out.bin \
              -D /tmp/h.txt -w '%{http_code}' "$url" || true)
            size=$(wc -c < /tmp/out.bin 2>/dev/null || echo 0)
            ct=$(grep -i '^content-type' /tmp/h.txt | tail -1 | tr -d '\r')
            echo "::warning title=probe::$label | HTTP=$code | bytes=$size | $ct | $url"
          }
          probe "githack"      "https://raw.githack.com/whssz/site/site-v1/public/index.html"
          echo "--- headers githack:"
          curl -sSLI --max-time 60 "https://raw.githack.com/whssz/site/site-v1/public/index.html" | head -20
          echo "--- titulo githack:"
          curl -sSL --max-time 60 "https://raw.githack.com/whssz/site/site-v1/public/index.html" | grep -o '<title>[^<]*</title>' | head -1
          echo "--- imgs embutidas:"
          curl -sSL --max-time 60 "https://raw.githack.com/whssz/site/site-v1/public/index.html" | grep -c 'data:image/webp;base64'
