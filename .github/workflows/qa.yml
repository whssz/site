# Portão de qualidade da Quatro em 1:
#   1. QA de animação e layout
#   2. QA de conformidade (LGPD / WCAG)
#   3. Teste funcional real do fluxo de pedido
#   4. Conferência do site publicado (HTTP 200 e arquivo autossuficiente)
# Roda em runner com navegador de verdade.
name: qa

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "index.html"
      - "public/**"
      - "scripts/test-flow.mjs"
      - ".github/workflows/qa.yml"

permissions:
  contents: write

env:
  SITE_URL: https://quatro-em-1.vercel.app/

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Playwright
        run: |
          npm i --no-audit --no-fund playwright@1.49.1
          npx playwright install chromium

      - name: QA de animação e layout
        run: node tools/qa.mjs index.html --min-loop 2 2>&1 | tee qa-animacao.txt

      - name: QA de conformidade (LGPD/WCAG)
        run: node tools/qa-legal.mjs index.html 2>&1 | tee qa-conformidade.txt

      - name: Teste funcional do fluxo de pedido
        run: node scripts/test-flow.mjs index.html 2>&1 | tee qa-fluxo.txt

      - name: Conferir site publicado
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -sS -o /tmp/page.html -w '%{http_code}' -L "$SITE_URL" || echo 000)
            echo "tentativa $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 10
          done
          echo "bytes: $(wc -c < /tmp/page.html)"
          echo "titulo: $(grep -o '<title>[^<]*</title>' /tmp/page.html | head -1)"
          if [ "$CODE" != "200" ]; then echo "FALHOU: site nao respondeu 200"; exit 1; fi
          python3 scripts/check-self-contained.py /tmp/page.html 2>&1 | tee qa-publicado.txt

      - name: Consolidar relatório
        if: always()
        run: |
          mkdir -p qa
          {
            echo "# Relatório de QA — Quatro em 1"
            echo
            echo "Gerado em: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Arquivo: index.html ($(stat -c%s index.html 2>/dev/null || echo '?') bytes)"
            echo "Site: $SITE_URL"
            echo
            echo "## 1. Animação e layout (tools/qa.mjs)"
            echo '```'; cat qa-animacao.txt 2>/dev/null; echo '```'
            echo
            echo "## 2. Conformidade (tools/qa-legal.mjs)"
            echo '```'; cat qa-conformidade.txt 2>/dev/null; echo '```'
            echo
            echo "## 3. Fluxo funcional do pedido (scripts/test-flow.mjs)"
            echo '```'; cat qa-fluxo.txt 2>/dev/null; echo '```'
            echo
            echo "## 4. Site publicado"
            echo '```'; cat qa-publicado.txt 2>/dev/null; echo '```'
          } > qa/RELATORIO.md
          cat qa/RELATORIO.md

      - name: Publicar relatório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A qa
          git commit -m "QA: relatório de animação, conformidade e fluxo [skip ci]" || echo "nada a commitar"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || echo "nada a enviar"
