name: Verificar publicação da pizzaria
on:
  push:
    branches: [arena/e5e97f0c-site]
    paths: ['qa/publicacao.json', '.github/workflows/verify-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicacao:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar status, tamanho, título e integridade do HTML público
        run: node tools/verify-production.mjs
