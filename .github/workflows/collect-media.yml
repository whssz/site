# Coleta a mídia pública oficial da Quatro em 1 (confeitaria · Campo Grande, RJ)
# no runner do GitHub Actions, que tem rede livre:
# Instagram @quatroem1 + Google Maps + cardápio oficial whatsmenu + marca.
# Entrega tudo como artefato (não volta para o git).
name: collect-media

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/collect-media.mjs"
      - ".github/workflows/collect-media.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: yt-dlp + ffmpeg
        run: |
          pip install -q -U yt-dlp || true
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) || true

      - name: Coletar mídia oficial
        run: node scripts/collect-media.mjs

      - name: Otimizar vídeos e gerar posters
        run: |
          mkdir -p media-raw/ig/web
          for v in media-raw/ig/*.mp4; do
            [ -f "$v" ] || continue
            b=$(basename "$v" .mp4)
            echo "--- $b"
            ffprobe -v error -show_entries format=duration:stream=width,height -of default=nw=1 "$v" > "media-raw/ig/web/${b}.probe.txt" 2>&1 || true
            ffmpeg -v error -y -i "$v" -an -vf "scale='min(720,iw)':-2" -c:v libx264 -crf 30 -preset veryfast -movflags +faststart "media-raw/ig/web/${b}_web.mp4" || true
            ffmpeg -v error -y -i "$v" -frames:v 1 -vf "scale=640:-2" -q:v 6 "media-raw/ig/web/${b}_poster.jpg" || true
          done
          du -sh media-raw/* || true
          ls -la media-raw/ig/web | head -60

      - name: Normalizar imagens (tamanho e peso, sem perder nitidez)
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          n=0
          find media-raw -maxdepth 2 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.png' -o -iname '*.img' \) -print0 | while IFS= read -r -d '' f; do
            d=$(dirname "$f"); b=$(basename "$f"); b="${b%.*}"
            case "$b" in _*|*logo*|*submarca*|*perfil*|*poster*) continue;; esac
            convert "$f" -auto-orient -strip -resize '1200x1200>' -quality 82 "$d/$b.jpg" 2>/dev/null
            [ -f "$d/$b.jpg" ] && rm -f "$f"
            n=$((n+1))
          done
          echo "imagens normalizadas: $n"
          du -sh media-raw/*

      - name: Relatório
        run: |
          find media-raw -type f | sed 's/^/  /' | sort | head -200
          echo "total: $(find media-raw -type f | wc -l) arquivos"

      - name: Devolver para a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media-raw
          git commit -m "Mídia bruta oficial coletada (Instagram + Maps + cardápio) [skip ci]" || echo "nada a commitar"
          git push origin HEAD:${GITHUB_REF_NAME}
