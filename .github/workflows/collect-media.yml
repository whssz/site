# Coleta a mídia pública oficial da Amunì a Caparica Pizzeria
# (Instagram + Google Maps + cardápio oficial + marca) no runner, com rede livre.
name: collect-media
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/collect-media.mjs"
      - ".github/workflows/collect-media.yml"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: yt-dlp + ffmpeg
        run: |
          pip install -q yt-dlp || true
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) || true
      - name: Coletar mídia oficial
        run: node scripts/collect-media.mjs
      - name: Otimizar vídeos e gerar posters/folhas de contato
        run: |
          mkdir -p media-raw/ig/web
          for v in media-raw/ig/*.mp4; do
            [ -f "$v" ] || continue
            b=$(basename "$v" .mp4)
            ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of default=nw=1 "$v" > "media-raw/ig/web/${b}.probe.txt" 2>&1 || true
            ffmpeg -v error -y -i "$v" -an -vf "scale='min(720,iw)':-2" -c:v libx264 -crf 30 -preset veryfast -movflags +faststart "media-raw/ig/web/${b}_web.mp4" || true
            ffmpeg -v error -y -i "$v" -frames:v 1 -vf "scale=640:-2" "media-raw/ig/web/${b}_poster.jpg" || true
            ffmpeg -v error -y -i "$v" -vf "fps=1/2,scale=240:-2,tile=6x3" -frames:v 1 "media-raw/ig/web/${b}_sheet.jpg" || true
          done
          du -sh media-raw/* || true
      - name: Devolver para a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media-raw
          git commit -m "Mídia bruta oficial coletada (Instagram + Maps + cardápio) [skip ci]" || echo "nada a commitar"
          git push origin HEAD:${GITHUB_REF_NAME}
