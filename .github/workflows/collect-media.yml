name: collect-media
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/collect-media.mjs"
      - ".github/workflows/collect-media.yml"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ferramentas (ffmpeg, poppler-utils, playwright)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg poppler-utils || true
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@latest >/dev/null 2>&1 || true
          npx playwright install chromium
      - name: Coletar pass 2 (Linktree PDF, carrosséis IG, horários Maps, stills HD)
        run: node scripts/collect-media.mjs
      - name: Extrair PDF do Cardápio e vídeo limpo sem tela final
        run: |
          if [ -f media-raw/menu/cardapio.pdf ]; then
            pdftotext -layout media-raw/menu/cardapio.pdf media-raw/menu/cardapio.txt || true
            pdftoppm -png -r 180 media-raw/menu/cardapio.pdf media-raw/menu/cardapio-page || true
          fi
          # Gera loops curtos e ultraleves (sem legendas queimadas!) para o Hero e para a seção Experiência
          if [ -f media-raw/ig/DfXB2A2vndu.mp4 ]; then
            ffmpeg -v error -y -ss 0 -t 11.5 -i media-raw/ig/DfXB2A2vndu.mp4 -an -vf "scale=540:-2" -c:v libx264 -crf 28 -preset slow -movflags +faststart media-raw/ig/web/hero-brunch-loop.mp4 || true
          fi
          if [ -f media-raw/ig/DfAIvjwhlTJ.mp4 ]; then
            ffmpeg -v error -y -ss 0 -t 8.5 -i media-raw/ig/DfAIvjwhlTJ.mp4 -an -vf "scale=480:-2" -c:v libx264 -crf 29 -preset slow -movflags +faststart media-raw/ig/web/massa-artesanal-loop.mp4 || true
          fi
          if [ -f media-raw/ig/DfFdEltBd2c.mp4 ]; then
            ffmpeg -v error -y -ss 0 -t 8.5 -i media-raw/ig/DfFdEltBd2c.mp4 -an -vf "scale=480:-2" -c:v libx264 -crf 29 -preset slow -movflags +faststart media-raw/ig/web/croissant-pizza-loop.mp4 || true
          fi
          rm -f package.json package-lock.json
          ls -lh media-raw/menu media-raw/brand media-raw/ig/photos media-raw/ig/stills || true
      - name: Devolver para a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media-raw
          git commit -m "Cardápio PDF, carrosséis IG, horários Maps e stills HD coletados [skip ci]" || echo "nada a commitar"
          git push origin HEAD:${GITHUB_REF_NAME}
