# Coleta a mídia pública oficial da Confeitaria Agridoce (Instagram + Google Maps)
# no runner (rede livre) e devolve os originais para a branch, para curadoria.
name: collect-media
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/collect-media.mjs"
      - ".github/workflows/collect-media.yml"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: yt-dlp + ffmpeg
        run: |
          pip install -q yt-dlp || true
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) || true
      - name: Coletar
        run: node scripts/collect-media.mjs
      - name: Folhas de contato dos vídeos
        run: |
          for v in media-raw/ig/*.mp4; do [ -f "$v" ] || continue
            ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of default=nw=1 "$v" > "${v%.mp4}.probe.txt" 2>&1 || true
            ffmpeg -v error -y -i "$v" -vf "fps=1/2,scale=240:-2,tile=6x3" -frames:v 1 "${v%.mp4}.sheet.jpg" || true
          done
          ls -la media-raw media-raw/ig media-raw/maps || true
      - name: Devolver para a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media-raw
          git commit -m "Mídia bruta coletada (Instagram oficial + Google Maps) [skip ci]" || echo "nada a commitar"
          git push origin HEAD:${GITHUB_REF_NAME}
