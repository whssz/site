name: collect-media
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/collect-media.mjs"
      - ".github/workflows/collect-media.yml"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ferramentas (yt-dlp, ffmpeg, poppler-utils, playwright)
        run: |
          pip install -q yt-dlp || true
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg poppler-utils webp || true
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@latest >/dev/null 2>&1 || true
          npx playwright install chromium
      - name: Coletar mídia e dados oficiais
        run: node scripts/collect-media.mjs
      - name: Extrair PDF do Cardápio e otimizar vídeos/posters
        run: |
          if [ -f media-raw/menu/cardapio.pdf ]; then
            pdftotext -layout media-raw/menu/cardapio.pdf media-raw/menu/cardapio.txt || true
            pdftoppm -png -r 180 media-raw/menu/cardapio.pdf media-raw/menu/cardapio-page || true
          fi
          mkdir -p media-raw/ig/web
          for v in media-raw/ig/*.mp4; do
            [ -f "$v" ] || continue
            b=$(basename "$v" .mp4)
            ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of default=nw=1 "$v" > "media-raw/ig/web/${b}.probe.txt" 2>&1 || true
            ffmpeg -v error -y -i "$v" -an -t 10 -vf "scale='min(540,iw)':-2" -c:v libx264 -crf 29 -preset veryfast -movflags +faststart "media-raw/ig/web/${b}_web.mp4" || true
            ffmpeg -v error -y -i "$v" -ss 00:00:01 -frames:v 1 -vf "scale=720:-2" "media-raw/ig/web/${b}_poster.webp" || true
            ffmpeg -v error -y -i "$v" -vf "fps=1/2,scale=240:-2,tile=5x2" -frames:v 1 "media-raw/ig/web/${b}_sheet.jpg" || true
          done
          rm -f package.json package-lock.json
          du -sh media-raw/* || true
      - name: Devolver para a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media-raw
          git commit -m "Mídia e cardápio oficiais coletados (Instagram + Linktree + Maps) [skip ci]" || echo "nada a commitar"
          git push origin HEAD:${GITHUB_REF_NAME}
