name: Brutta · verificar publicação pública

on:
  push:
    branches: [arena/ad59ad84-site]
    paths:
      - 'src/**'
      - 'vercel.json'
      - 'tools/*.mjs'
      - 'tools/anim-kit.*'
      - '.github/workflows/verify-brutta.yml'

permissions:
  contents: read

concurrency:
  group: brutta-public-check
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm run build
      - name: GET anónimo e verificação de integridade
        run: node tools/verify-deploy.mjs https://brutta-pizzeria.vercel.app/ 180
